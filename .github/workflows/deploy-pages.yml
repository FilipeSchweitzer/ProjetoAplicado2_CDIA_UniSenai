name: Deploy DataMol (GitHub Pages)

# Publica o dashboard estático no GitHub Pages.
# Roda a cada push na main (cada alteração sua vai ao ar automaticamente)
# e também pode ser disparado manualmente em Actions > Run workflow.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Garante um deploy de cada vez, cancelando o anterior se um novo chegar.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages (ativa automaticamente)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Montar site estático (front + CSV)
        run: |
          mkdir -p _site/vizuPlanilhas _site/codigoPlanilhas
          cp index.html _site/index.html
          cp -r vizuPlanilhas/. _site/vizuPlanilhas/
          cp codigoPlanilhas/final_integrado_com_hmdb.csv _site/codigoPlanilhas/

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
